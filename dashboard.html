<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ภาพรวม 2 กิจการ — อาจารย์กอล์ฟ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FAF6EF; --surface-1:#FFFFFF; --surface-2:#F5EDE0;
  --border:rgba(154,122,42,.22);
  --text-primary:#2A1F14; --text-secondary:#5C4A34; --text-muted:#8A7659;
  --gold:#9A7A2A; --gold-soft:#C9A96E;
  --c-bb:#a8791c;        /* BB Glow */
  --c-sam:#b03a2e;       /* สำนัก */
  --c-profit:#1b7a58; --c-comm:#2a78d6; --c-salary:#4a3aa7; --c-product:#b57600;
  --shadow:0 1px 3px rgba(80,50,10,.07), 0 6px 18px rgba(80,50,10,.06);
  --r:16px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#16120E; --surface-1:#221B14; --surface-2:#2B2219;
    --border:rgba(201,169,110,.2);
    --text-primary:#F6EEE0; --text-secondary:#D3C3A8; --text-muted:#9E8B70;
    --gold:#E8C87A; --gold-soft:#A98A50;
    --c-bb:#c9962c; --c-sam:#cf5b4e;
    --c-profit:#3fc194; --c-comm:#6ba8ee; --c-salary:#9085e9; --c-product:#e0a534;
    --shadow:0 1px 3px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.3);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text-primary);
  font-family:'Sarabun',system-ui,-apple-system,sans-serif;font-size:16px;line-height:1.5;
  padding-bottom:calc(30px + env(safe-area-inset-bottom))}
button{font-family:inherit;cursor:pointer;border:none}
input{font-family:inherit;font-size:1rem}
.hide{display:none !important}
.wrap{max-width:820px;margin:0 auto;padding:16px 16px 0}

/* header */
header{display:flex;align-items:center;gap:10px;padding:14px 16px 4px;max-width:820px;margin:0 auto}
header .ttl{flex:1;min-width:0}
header h1{margin:0;font-size:1.12rem;font-weight:700;letter-spacing:-.2px}
header .sub{font-size:.8rem;color:var(--text-muted)}
.iconbtn{background:var(--surface-1);border:1px solid var(--border);border-radius:11px;
  width:40px;height:40px;font-size:1.1rem;color:var(--text-secondary);flex:0 0 auto}

/* range */
.ranges{display:flex;gap:7px;overflow-x:auto;padding:12px 16px 2px;max-width:820px;margin:0 auto;
  -webkit-overflow-scrolling:touch}
.ranges button{padding:9px 16px;border-radius:22px;background:var(--surface-1);
  border:1px solid var(--border);color:var(--text-secondary);font-size:.92rem;white-space:nowrap;flex:0 0 auto}
.ranges button.on{background:var(--gold);color:var(--bg);border-color:var(--gold);font-weight:600}

/* cards */
.card{background:var(--surface-1);border:1px solid var(--border);border-radius:var(--r);
  padding:18px;box-shadow:var(--shadow);margin-bottom:12px}
.lb{font-size:.82rem;color:var(--text-muted)}
.hero .lb{font-size:.86rem}
.hero .big{font-size:2.5rem;font-weight:700;letter-spacing:-1px;line-height:1.1;margin:4px 0 2px}
.hero .big small{font-size:1.1rem;font-weight:500;color:var(--text-muted);margin-left:4px}
.herorow{display:flex;gap:14px;margin-top:14px;padding-top:14px;border-top:1px solid var(--border);
  flex-wrap:wrap}
.herorow>div{flex:1;min-width:110px}
.herorow .v{font-size:1.3rem;font-weight:700;margin-top:2px}

/* split bar */
.splitbar{display:flex;height:12px;border-radius:7px;overflow:hidden;margin:14px 0 9px;gap:2px;
  background:var(--surface-2)}
.splitbar i{display:block;height:100%}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:.86rem;color:var(--text-secondary)}
.legend span{display:flex;align-items:center;gap:6px}
.dot{width:10px;height:10px;border-radius:3px;flex:0 0 auto}

/* two business cards */
.two{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:640px){ .two{grid-template-columns:1fr 1fr} }
.bizhead{display:flex;align-items:center;gap:9px;margin-bottom:12px}
.bizhead .dot{width:12px;height:12px;border-radius:4px}
.bizhead h2{margin:0;font-size:1.02rem;font-weight:700}
.bignum{font-size:1.9rem;font-weight:700;letter-spacing:-.5px;line-height:1.15}
.sub2{display:flex;gap:14px;margin-top:10px;flex-wrap:wrap}
.sub2>div{flex:1;min-width:88px}
.sub2 .v{font-size:1.05rem;font-weight:600;margin-top:1px}
.pf{margin-top:14px;padding-top:12px;border-top:1px solid var(--border)}
.pfline{display:flex;justify-content:space-between;font-size:.9rem;padding:4px 0;color:var(--text-secondary)}
.pfline b{color:var(--text-primary);font-weight:600}
.pfline.tot{border-top:1px dashed var(--border);margin-top:6px;padding-top:9px;font-size:1rem}
.pfline.tot b{color:var(--c-profit);font-size:1.15rem}

.lastbill{margin-top:9px;padding:9px 11px;border-radius:10px;background:var(--surface-2);
  color:var(--text-secondary);font-size:.88rem;line-height:1.45}

/* chart */
.bars{display:flex;align-items:flex-end;gap:5px;height:160px;margin-top:6px}
.bcol{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;
  gap:3px;min-width:0}
.bstack{width:100%;max-width:46px;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;height:100%}
.bstack i{display:block;width:100%;border-radius:3px}
.bstack i.top{border-radius:5px 5px 3px 3px}
.bval{font-size:.68rem;color:var(--text-muted);white-space:nowrap}
.bxs{display:flex;gap:5px;margin-top:7px}
.bxs>div{flex:1;text-align:center;font-size:.75rem;color:var(--text-muted);min-width:0}

/* table */
table{width:100%;border-collapse:collapse;font-size:.95rem}
th{text-align:left;font-weight:500;color:var(--text-muted);font-size:.8rem;padding:8px 6px;
  border-bottom:1px solid var(--border)}
td{padding:10px 6px;border-bottom:1px solid var(--border)}
td.n{text-align:right;white-space:nowrap}
td.g{font-weight:700;color:var(--gold)}
tr:last-child td{border-bottom:none}
h3.sec{font-size:.86rem;color:var(--text-muted);font-weight:500;margin:22px 0 10px;
  display:flex;align-items:center;gap:9px}
h3.sec::after{content:"";flex:1;height:1px;background:var(--border)}

.staff{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--border)}
.staff:last-child{border-bottom:none}
.av{width:38px;height:38px;border-radius:50%;flex:0 0 auto;display:flex;align-items:center;
  justify-content:center;color:#fff;font-weight:700;font-size:.9rem}
.staff .nm{flex:1;min-width:0}
.staff .nm b{display:block;font-size:.98rem}
.staff .nm span{font-size:.8rem;color:var(--text-muted)}
.staff .amt{text-align:right;white-space:nowrap}
.staff .amt b{display:block;font-size:1.02rem}
.staff .amt span{font-size:.78rem;color:var(--text-muted)}

.note{font-size:.85rem;color:var(--text-muted);line-height:1.55}
.warn{background:rgba(181,118,0,.1);border:1px solid rgba(181,118,0,.35);border-radius:12px;
  padding:11px 13px;font-size:.87rem;color:var(--text-secondary);margin-bottom:12px}
.empty{text-align:center;color:var(--text-muted);padding:20px 0;font-size:.95rem}
#loading{text-align:center;padding:60px 20px;color:var(--text-muted)}
.spin{width:30px;height:30px;border:3px solid var(--border);border-top-color:var(--gold);
  border-radius:50%;margin:0 auto 14px;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* settings sheet */
#sheet{position:fixed;inset:0;background:rgba(20,12,4,.55);z-index:90;display:flex;
  align-items:flex-end;justify-content:center}
.sheetbox{background:var(--surface-1);width:100%;max-width:560px;border-radius:20px 20px 0 0;
  padding:20px 18px calc(24px + env(safe-area-inset-bottom));max-height:88vh;overflow-y:auto}
.sheetbox h2{margin:0 0 4px;font-size:1.1rem}
.frow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border)}
.frow label{flex:1;font-size:.94rem}
.frow input{width:96px;padding:9px 11px;border-radius:9px;border:1px solid var(--border);
  background:var(--surface-2);color:var(--text-primary);text-align:right}
.btnrow{display:flex;gap:9px;margin-top:18px}
.btnrow button{flex:1;padding:14px;border-radius:12px;font-size:1rem;font-weight:600}
.btnrow .cancel{background:var(--surface-2);color:var(--text-primary)}
.btnrow .save{background:var(--gold);color:var(--bg)}
</style>
</head>

<div id="loading"><div class="spin"></div>กำลังโหลดข้อมูล…</div>

<div id="app" class="hide">
  <header>
    <div class="ttl">
      <h1>ภาพรวม 2 กิจการ</h1>
      <div class="sub">BB Glow หัวหิน · สำนักบ้านนนทภักดิ์</div>
    </div>
    <button class="iconbtn" id="gear" title="ตั้งค่าต้นทุน">⚙️</button>

  <div class="ranges" id="ranges">
    <button data-r="today" class="on">วันนี้</button>
    <button data-r="d7">7 วัน</button>
    <button data-r="d15">15 วัน</button>
    <button data-r="month">เดือนนี้</button>

  <div class="wrap" id="body"></div>
</div>

<!-- settings -->
<div id="sheet" class="hide">
  <div class="sheetbox">
    <h2>ตั้งค่าต้นทุน</h2>
    <p class="note">ใช้ค่าชุดเดียวกับแดชบอร์ด BB Glow ตัวเดิม แก้ที่นี่แล้วอีกตัวเปลี่ยนตาม · ฝั่งสำนักไม่คิดต้นทุน ตามที่อาจารย์สั่ง</p>
    <div id="fields"></div>
    <div class="btnrow">
      <button class="cancel" id="sclose">ปิด</button>
      <button class="save" id="ssave">บันทึก</button>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, doc, onSnapshot, setDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyB8HM1grB7OsiBvdLo5xRH5SqLnQoLR25U",
  authDomain: "bbglowhuahin-3bb7d.firebaseapp.com",
  projectId: "bbglowhuahin-3bb7d",
  storageBucket: "bbglowhuahin-3bb7d.firebasestorage.app",
  messagingSenderId: "714462283652",
  appId: "1:714462283652:web:088c6ddde11f46fc08ffd1"
};
// เผื่ออนาคตที่ปิด Firestore Rules แล้วต้องล็อกอิน (เหมือนแดชบอร์ดตัวเดิม)
const DASH_AUTH = { enabled:false, email:'dashboard@bbglow.local', password:'' };

const app = initializeApp(firebaseConfig);
const db  = getFirestore(app);
async function ensureAuth(){
  if(!DASH_AUTH.enabled) return;
  try{ await signInWithEmailAndPassword(getAuth(app), DASH_AUTH.email, DASH_AUTH.password); }
  catch(e){ console.warn('เข้าระบบอ่านข้อมูลไม่สำเร็จ', e.code||e); }
}
window.listenBB    = cb => onSnapshot(collection(db,'sales'),        s=>cb(s.docs.map(d=>d.data())));
window.listenSam   = cb => onSnapshot(collection(db,'samnak_sales'), s=>cb(s.docs.map(d=>d.data())));
window.listenCosts = cb => onSnapshot(doc(db,'config','costs'),      s=>cb(s.exists()?s.data():null));
window.saveCosts   = data => setDoc(doc(db,'config','costs'), data);
await ensureAuth();
window.dbReady = true;
window.dispatchEvent(new Event('dbReady'));
</script>

<script>
/* ═══════════════════════════════════════════════════════════
   แดชบอร์ดรวม 2 กิจการ · v1.0 · 24 ก.ย. 69 · อัมรินทร์
   BB Glow  → collection `sales`         (สูตรกำไรเดียวกับแดชบอร์ดเดิม)
   สำนัก    → collection `samnak_sales`  (ไม่คิดต้นทุน: ยอดขาย = กำไร)
   ═══════════════════════════════════════════════════════════ */

const DEFAULTS = {
  salaryTotal: 22000,                  // เงินเดือนรวมทีม BB Glow ต่อเดือน
  rateBB: 13, rateWax: 7, rateSpa: 7,  // ต้นทุนผลิตภัณฑ์ (% ของยอดบริการ)
  hcCost: {}                           // ทุนสินค้าโฮมแคร์ต่อชิ้น
};
let COSTS = {...DEFAULTS};

const STAFF = [
  {id:'S2', name:'คุณเอ', bg:'linear-gradient(135deg,#3A6B47,#6B9E78)'},
  {id:'S3', name:'หญิง',  bg:'linear-gradient(135deg,#A05040,#D4846A)'},
];
const HOMECARE = [
  {id:'foam_pinn',name:'โฟมล้างหน้า'},{id:'moist_pinn',name:'มอยด์เจอร์'},
  {id:'adv_pinn',name:'แอดวานซ์เซรั่ม'},{id:'mask_uv',name:'แมสยูวี'},
  {id:'spray_spf',name:'สเปรย์กันแดด'},{id:'mask_face',name:'มาร์กหน้า'},
  {id:'essence_wax',name:'เอสเซ้น ผิวแข็งแรง'}
];
const WAX_WORDS = ['แว็กซ์','แวกซ์','wax','ขนรักแร้','ขนแขน','ขนขา','บิกินี่'];
const SPA_WORDS = ['สปา','spa','นวด','ขัดผิว','อบ'];

let BB = [], SAM = [], range = 'today', loaded = {bb:false, sam:false};

/* ---------- helper ---------- */
const $ = s=>document.querySelector(s);
const $$ = s=>[...document.querySelectorAll(s)];
const money = n=>Math.round(n||0).toLocaleString('th-TH');
const esc = s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pct = (a,b)=> b>0 ? Math.round(a/b*100) : 0;

function daysInMonth(d){ return new Date(d.getFullYear(), d.getMonth()+1, 0).getDate(); }
function daysInRange(key){
  if(key==='today') return 1;
  if(key==='d7') return 7;
  if(key==='d15') return 15;
  return new Date().getDate();
}
function rangeBounds(key){
  const end = new Date(); end.setHours(23,59,59,999);
  const start = new Date();
  if(key==='today') start.setHours(0,0,0,0);
  else if(key==='d7'){ start.setDate(start.getDate()-6); start.setHours(0,0,0,0); }
  else if(key==='d15'){ start.setDate(start.getDate()-14); start.setHours(0,0,0,0); }
  else { start.setDate(1); start.setHours(0,0,0,0); }
  return {start, end};
}
function salaryForRange(key){
  const {start} = rangeBounds(key);
  const n = daysInRange(key);
  let sum = 0;
  for(let i=0;i<n;i++){
    const d = new Date(start); d.setDate(d.getDate()+i);
    sum += COSTS.salaryTotal / daysInMonth(d);
  }
  return sum;
}
function rangeLabel(key){
  return {today:'วันนี้', d7:'7 วันล่าสุด', d15:'15 วันล่าสุด', month:'เดือนนี้'}[key]||'';
}

/* ---------- BB Glow ---------- */
function guessGroup(name){
  const s = (name||'').toLowerCase();
  if(SPA_WORDS.some(w=>s.includes(w.toLowerCase()))) return 'spa';
  if(WAX_WORDS.some(w=>s.includes(w.toLowerCase()))) return 'wax';
  return 'bb';
}
function serviceByGroup(sale){
  const out = {bb:0, wax:0, spa:0, estimated:false};
  if(Array.isArray(sale.serviceItems) && sale.serviceItems.length){
    sale.serviceItems.forEach(it => { out[it.group||'bb'] += (it.price||0); });
    return out;
  }
  out.estimated = true;
  const total = sale.serviceTotal!=null ? sale.serviceTotal : (sale.price||0);
  const names = (sale.service||'').split(',').map(s=>s.trim()).filter(Boolean);
  if(!names.length){ out.bb += total; return out; }
  const groups = [...new Set(names.map(guessGroup))];
  if(groups.length===1) out[groups[0]] += total; else out.bb += total;
  return out;
}
function homecareCost(sale){
  if(!Array.isArray(sale.homecareItems)) return 0;
  return sale.homecareItems.reduce((sum,it)=>{
    const unit = COSTS.hcCost[it.id];
    return sum + (unit ? unit*(it.qty||0) : 0);
  },0);
}
// บิลขายจริงของ BB Glow: ไม่ใช่รายการจองคิว (type) และไม่ใช่บิลที่ยกเลิก
function isRealBB(s){ return !s.type && !s.voided; }

function computeBB(key){
  const {start,end} = rangeBounds(key);
  const bills = BB.filter(s=> isRealBB(s) && (()=>{ const d=new Date(s.date); return d>=start && d<=end; })() );
  let revenue=0, cash=0, transfer=0, svc=0, hc=0, comm=0, estimatedBills=0;
  const g={bb:0,wax:0,spa:0}, staffMap={}, svcMap={}, hcMap={};
  STAFF.forEach(s=>staffMap[s.id]={...s, bills:0, revenue:0, comm:0});

  bills.forEach(s=>{
    const paid = s.totalPaid!=null ? s.totalPaid : (s.paid||0);
    revenue += paid;
    if(s.payMethod==='transfer') transfer += paid; else cash += paid;
    svc += (s.serviceTotal!=null ? s.serviceTotal : (s.price||0));
    hc  += (s.homecareTotal||0);

    const bg = serviceByGroup(s);
    g.bb+=bg.bb; g.wax+=bg.wax; g.spa+=bg.spa;
    if(bg.estimated && (s.serviceTotal||s.price)) estimatedBills++;

    const mainComm = s.commission||0;
    const coComm = (s.coStaffs||[]).reduce((a,c)=>a+(c.comm||0),0);
    comm += mainComm + coComm;
    if(s.staffId && staffMap[s.staffId]){
      staffMap[s.staffId].bills++; staffMap[s.staffId].revenue += paid; staffMap[s.staffId].comm += mainComm;
    }
    (s.coStaffs||[]).forEach(c=>{ if(staffMap[c.staffId]) staffMap[c.staffId].comm += (c.comm||0); });

    if(Array.isArray(s.serviceItems) && s.serviceItems.length){
      s.serviceItems.forEach(it=>{
        const k=it.name||'บริการ';
        if(!svcMap[k]) svcMap[k]={name:k, qty:0, total:0};
        svcMap[k].qty++; svcMap[k].total += (it.price||0);
      });
    } else if(s.service){
      const arr = s.service.split(',').map(x=>x.trim()).filter(Boolean);
      arr.forEach(nm=>{
        if(!svcMap[nm]) svcMap[nm]={name:nm, qty:0, total:0};
        svcMap[nm].qty++;
        svcMap[nm].total += (s.serviceTotal!=null?s.serviceTotal:(s.price||0))/arr.length;
      });
    }
    (s.homecareItems||[]).forEach(it=>{
      if(!hcMap[it.id]) hcMap[it.id]={id:it.id, name:it.name, qty:0, total:0};
      hcMap[it.id].qty += (it.qty||0);
      hcMap[it.id].total += (it.total || (it.unitPrice||0)*(it.qty||0));
    });
  });

  const productCost = g.bb*COSTS.rateBB/100 + g.wax*COSTS.rateWax/100 + g.spa*COSTS.rateSpa/100
                    + bills.reduce((a,s)=>a+homecareCost(s),0);
  const salary = salaryForRange(key);
  const profit = revenue - comm - salary - productCost;

  return {count:bills.length, revenue, cash, transfer, svc, hc, comm, salary, productCost, profit,
    estimatedBills, avg: bills.length?revenue/bills.length:0,
    staff:Object.values(staffMap),
    services:Object.values(svcMap).sort((a,b)=>b.total-a.total),
    homecare:Object.values(hcMap).sort((a,b)=>b.total-a.total)};
}

/* ---------- สำนัก (ไม่คิดต้นทุน) ---------- */
function computeSam(key){
  const {start,end} = rangeBounds(key);
  const bills = SAM.filter(s=> !s.void && (()=>{ const d=new Date(s.ts); return d>=start && d<=end; })() );
  let revenue=0, cash=0, transfer=0;
  const itemMap={};
  bills.forEach(s=>{
    revenue += (s.total||0);
    if(s.pay==='transfer') transfer += (s.total||0); else cash += (s.total||0);
    (s.items||[]).forEach(it=>{
      const k=it.name||'รายการ';
      if(!itemMap[k]) itemMap[k]={name:k, qty:0, total:0};
      itemMap[k].qty += (it.qty||1);
      itemMap[k].total += (it.price||0)*(it.qty||1);
    });
  });
  return {count:bills.length, revenue, cash, transfer,
    profit: revenue,                       // ไม่หักต้นทุน ตามที่อาจารย์สั่ง
    avg: bills.length?revenue/bills.length:0,
    items:Object.values(itemMap).sort((a,b)=>b.total-a.total)};
}

/* ---------- วันล่าสุดที่มีบิล (ไว้บอกตอนช่วงที่เลือกยังว่าง) ---------- */
function lastBillDate(which){
  const arr = which==='bb'
    ? BB.filter(isRealBB).map(s=>s.date)
    : SAM.filter(s=>!s.void).map(s=>s.ts);
  if(!arr.length) return null;
  const d = new Date(Math.max(...arr.map(x=>+new Date(x))));
  const TM=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
  return d.getDate()+' '+TM[d.getMonth()]+' '+(d.getFullYear()+543);
}
function emptyHint(which){
  const last = lastBillDate(which);
  return '<div class="lastbill">ยังไม่มีบิลในช่วงที่เลือก'+
         (last? ' · บิลล่าสุด '+esc(last) : '')+'</div>';
}

/* ---------- กราฟ 7 วัน ---------- */
function last7(){
  const out=[];
  for(let i=6;i>=0;i--){
    const d=new Date(); d.setDate(d.getDate()-i); d.setHours(0,0,0,0);
    const key=d.toDateString();
    const bb = BB.filter(s=>isRealBB(s) && new Date(s.date).toDateString()===key)
                 .reduce((a,s)=>a+(s.totalPaid!=null?s.totalPaid:(s.paid||0)),0);
    const sam = SAM.filter(s=>!s.void && new Date(s.ts).toDateString()===key)
                   .reduce((a,s)=>a+(s.total||0),0);
    out.push({bb, sam, label:d.toLocaleDateString('th-TH',{weekday:'short'}), day:d.getDate()});
  }
  return out;
}

/* ---------- แสดงผล ---------- */
function render(){
  const b = computeBB(range), s = computeSam(range);
  const revenue = b.revenue + s.revenue;
  const profit  = b.profit + s.profit;
  const count   = b.count + s.count;
  const days7   = last7();
  const mx = Math.max(1, ...days7.map(d=>d.bb+d.sam));

  let h = '';

  /* HERO */
  h += '<div class="card hero">';
  h += '<div class="lb">ยอดขายรวม 2 กิจการ · '+esc(rangeLabel(range))+'</div>';
  h += '<div class="big">'+money(revenue)+'<small>บาท</small></div>';
  h += '<div class="splitbar">'+
       '<i style="width:'+(revenue?b.revenue/revenue*100:50)+'%;background:var(--c-bb)"></i>'+
       '<i style="width:'+(revenue?s.revenue/revenue*100:50)+'%;background:var(--c-sam)"></i></div>';
  h += '<div class="legend">'+
       '<span><i class="dot" style="background:var(--c-bb)"></i>BB Glow '+pct(b.revenue,revenue)+'% · '+money(b.revenue)+' ฿</span>'+
       '<span><i class="dot" style="background:var(--c-sam)"></i>สำนัก '+pct(s.revenue,revenue)+'% · '+money(s.revenue)+' ฿</span></div>';
  h += '<div class="herorow">'+
       '<div><div class="lb">กำไรรวม</div><div class="v" style="color:var(--c-profit)">'+money(profit)+' ฿</div></div>'+
       '<div><div class="lb">จำนวนบิล</div><div class="v">'+count+'</div></div>'+
       '<div><div class="lb">เฉลี่ยต่อบิล</div><div class="v">'+money(count?revenue/count:0)+' ฿</div></div>'+
       '</div></div>';

  if(b.estimatedBills>0){
    h += '<div class="warn">⚠️ ฝั่ง BB Glow มี '+b.estimatedBills+' บิลที่เป็นบิลเก่า (ก่อน POS v2.1) ระบบเดากลุ่มบริการให้ ค่าผลิตภัณฑ์จึงเป็นตัวเลขประมาณ</div>';
  }

  /* สองกิจการ */
  h += '<div class="two">';

  // BB Glow
  h += '<div class="card"><div class="bizhead"><i class="dot" style="background:var(--c-bb)"></i><h2>BB Glow หัวหิน</h2></div>';
  h += '<div class="lb">ยอดขาย</div><div class="bignum">'+money(b.revenue)+' ฿</div>';
  h += '<div class="sub2">'+
       '<div><div class="lb">บิล</div><div class="v">'+b.count+'</div></div>'+
       '<div><div class="lb">เฉลี่ย/บิล</div><div class="v">'+money(b.avg)+'</div></div>'+
       '<div><div class="lb">เงินสด/โอน</div><div class="v" style="font-size:.95rem">'+money(b.cash)+' / '+money(b.transfer)+'</div></div>'+
       '</div>';
  if(!b.count) h += emptyHint('bb');
  h += '<div class="pf">'+
       '<div class="pfline"><span>หัก ค่าคอมพนักงาน</span><b style="color:var(--c-comm)">−'+money(b.comm)+'</b></div>'+
       '<div class="pfline"><span>หัก เงินเดือน ('+daysInRange(range)+' วัน)</span><b style="color:var(--c-salary)">−'+money(b.salary)+'</b></div>'+
       '<div class="pfline"><span>หัก ค่าผลิตภัณฑ์</span><b style="color:var(--c-product)">−'+money(b.productCost)+'</b></div>'+
       '<div class="pfline tot"><span>กำไรเหลือ</span><b>'+money(b.profit)+' ฿ <span style="font-size:.8rem;font-weight:500">('+pct(b.profit,b.revenue)+'%)</span></b></div>'+
       '</div></div>';

  // สำนัก
  h += '<div class="card"><div class="bizhead"><i class="dot" style="background:var(--c-sam)"></i><h2>สำนักบ้านนนทภักดิ์</h2></div>';
  h += '<div class="lb">ยอดขาย</div><div class="bignum">'+money(s.revenue)+' ฿</div>';
  h += '<div class="sub2">'+
       '<div><div class="lb">บิล</div><div class="v">'+s.count+'</div></div>'+
       '<div><div class="lb">เฉลี่ย/บิล</div><div class="v">'+money(s.avg)+'</div></div>'+
       '<div><div class="lb">เงินสด/โอน</div><div class="v" style="font-size:.95rem">'+money(s.cash)+' / '+money(s.transfer)+'</div></div>'+
       '</div>';
  if(!s.count) h += emptyHint('sam');
  h += '<div class="pf">'+
       '<div class="pfline"><span>ไม่คิดต้นทุน (อาจารย์ทำเอง)</span><b>−0</b></div>'+
       '<div class="pfline tot"><span>กำไรเหลือ</span><b>'+money(s.profit)+' ฿ <span style="font-size:.8rem;font-weight:500">(100%)</span></b></div>'+
       '</div></div>';

  h += '</div>';

  /* กราฟ */
  h += '<div class="card"><div class="lb">ยอดขาย 7 วันล่าสุด (สองกิจการซ้อนกัน)</div><div class="bars">';
  days7.forEach(d=>{
    const tot = d.bb+d.sam;
    const hp = v=> Math.round(v/mx*100);
    h += '<div class="bcol" title="'+d.day+': BB '+money(d.bb)+' / สำนัก '+money(d.sam)+'">'+
         (tot?'<span class="bval">'+(tot>=1000?Math.round(tot/1000)+'k':tot)+'</span>':'')+
         '<span class="bstack">'+
           (d.sam?'<i class="top" style="height:'+hp(d.sam)+'%;background:var(--c-sam)"></i>':'')+
           (d.bb?'<i class="'+(d.sam?'':'top')+'" style="height:'+hp(d.bb)+'%;background:var(--c-bb)"></i>':'')+
         '</span></div>';
  });
  h += '</div><div class="bxs">'+days7.map(d=>'<div>'+d.label+'<br>'+d.day+'</div>').join('')+'</div>';
  h += '<div class="legend" style="margin-top:12px">'+
       '<span><i class="dot" style="background:var(--c-bb)"></i>BB Glow</span>'+
       '<span><i class="dot" style="background:var(--c-sam)"></i>สำนัก</span></div></div>';

  /* พนักงาน BB Glow */
  const activeStaff = b.staff.filter(x=>x.bills>0 || x.comm>0);
  if(activeStaff.length){
    h += '<h3 class="sec">พนักงาน BB Glow</h3><div class="card">';
    activeStaff.forEach(st=>{
      const share = b.salary/Math.max(1,STAFF.length);
      h += '<div class="staff"><div class="av" style="background:'+st.bg+'">'+esc(st.name.slice(0,1))+'</div>'+
           '<div class="nm"><b>'+esc(st.name)+'</b><span>'+st.bills+' บิล · ยอด '+money(st.revenue)+' ฿</span></div>'+
           '<div class="amt"><b>'+money(st.comm+share)+' ฿</b><span>คอม '+money(st.comm)+' + เงินเดือน '+money(share)+'</span></div></div>';
    });
    h += '</div>';
  }

  /* บริการ BB Glow */
  if(b.services.length){
    h += '<h3 class="sec">บริการที่ขาย — BB Glow</h3><div class="card"><table><thead><tr>'+
         '<th>บริการ</th><th style="text-align:right">ครั้ง</th><th style="text-align:right">ยอด</th></tr></thead><tbody>';
    b.services.slice(0,12).forEach(x=>{
      h += '<tr><td>'+esc(x.name)+'</td><td class="n">'+x.qty+'</td><td class="n g">'+money(x.total)+'</td></tr>';
    });
    h += '</tbody></table></div>';
  }

  /* รายการสำนัก */
  if(s.items.length){
    h += '<h3 class="sec">รายการที่ทำ — สำนัก</h3><div class="card"><table><thead><tr>'+
         '<th>รายการ</th><th style="text-align:right">ครั้ง</th><th style="text-align:right">ยอด</th></tr></thead><tbody>';
    s.items.slice(0,12).forEach(x=>{
      h += '<tr><td>'+esc(x.name)+'</td><td class="n">'+x.qty+'</td><td class="n g">'+money(x.total)+'</td></tr>';
    });
    h += '</tbody></table></div>';
  }

  /* โฮมแคร์ */
  if(b.homecare.length){
    h += '<h3 class="sec">สินค้าโฮมแคร์ — BB Glow</h3><div class="card"><table><thead><tr>'+
         '<th>สินค้า</th><th style="text-align:right">ชิ้น</th><th style="text-align:right">ยอด</th></tr></thead><tbody>';
    b.homecare.forEach(x=>{
      h += '<tr><td>'+esc(x.name||x.id)+'</td><td class="n">'+x.qty+'</td><td class="n g">'+money(x.total)+'</td></tr>';
    });
    h += '</tbody></table></div>';
  }

  if(!count){
    h += '<div class="card"><div class="empty">ยังไม่มีบิลในช่วงนี้</div></div>';
  }

  h += '<p class="note" style="text-align:center;margin:18px 0 8px">ตัวเลขดิบ ไม่รวมค่าเช่า/น้ำไฟ · อัปเดตสดตามบิลที่ปิดในระบบ</p>';

  $('#body').innerHTML = h;
}

/* ---------- ตั้งค่า ---------- */
function openSheet(){
  let h = '';
  h += '<div class="frow"><label>เงินเดือนรวมทีม BB Glow (บาท/เดือน)</label><input id="f_salary" type="number" value="'+COSTS.salaryTotal+'"></div>';
  h += '<div class="frow"><label>ต้นทุนผลิตภัณฑ์ งาน BB (%)</label><input id="f_bb" type="number" value="'+COSTS.rateBB+'"></div>';
  h += '<div class="frow"><label>ต้นทุนผลิตภัณฑ์ งานแว็กซ์ (%)</label><input id="f_wax" type="number" value="'+COSTS.rateWax+'"></div>';
  h += '<div class="frow"><label>ต้นทุนผลิตภัณฑ์ งานสปา (%)</label><input id="f_spa" type="number" value="'+COSTS.rateSpa+'"></div>';
  h += '<h3 class="sec">ทุนสินค้าโฮมแคร์ต่อชิ้น</h3>';
  HOMECARE.forEach(p=>{
    h += '<div class="frow"><label>'+esc(p.name)+'</label><input data-hc="'+p.id+'" type="number" value="'+(COSTS.hcCost[p.id]||'')+'" placeholder="0"></div>';
  });
  $('#fields').innerHTML = h;
  $('#sheet').classList.remove('hide');
}
function saveSheet(){
  const next = {
    salaryTotal: +$('#f_salary').value || 0,
    rateBB: +$('#f_bb').value || 0,
    rateWax: +$('#f_wax').value || 0,
    rateSpa: +$('#f_spa').value || 0,
    hcCost: {}
  };
  $$('#fields input[data-hc]').forEach(i=>{ const v=+i.value; if(v>0) next.hcCost[i.dataset.hc]=v; });
  COSTS = next;
  try{ localStorage.setItem('dash2_costs', JSON.stringify(next)); }catch(e){}
  if(window.saveCosts) window.saveCosts(next).catch(e=>console.warn('บันทึกค่าตั้งค่าไม่สำเร็จ',e));
  $('#sheet').classList.add('hide');
  render();
}

/* ---------- เริ่มระบบ ---------- */
function showApp(){
  $('#loading').classList.add('hide');
  $('#app').classList.remove('hide');
  render();
}
function startListening(){
  try{ const c = JSON.parse(localStorage.getItem('dash2_costs')); if(c) COSTS = {...DEFAULTS, ...c}; }catch(e){}

  if(window.__MOCK__){                       // โหมดทดสอบ
    BB = window.__MOCK__.bb||[]; SAM = window.__MOCK__.sam||[];
    if(window.__MOCK__.costs) COSTS = {...DEFAULTS, ...window.__MOCK__.costs};
    showApp(); return;
  }
  window.listenBB(rows=>{ BB = rows; loaded.bb = true; if(loaded.bb) showApp(); });
  window.listenSam(rows=>{ SAM = rows; loaded.sam = true; showApp(); });
  window.listenCosts(c=>{ if(c){ COSTS = {...DEFAULTS, ...c}; render(); } });
  setTimeout(()=>{ if(!loaded.bb && !loaded.sam) showApp(); }, 9000);  // เน็ตช้า/อ่านไม่ได้ ก็ยังเปิดหน้าให้เห็น
}
if(window.__MOCK__ || window.dbReady) startListening();
else window.addEventListener('dbReady', startListening);

$('#ranges').addEventListener('click', e=>{
  const b = e.target.closest('button'); if(!b) return;
  range = b.dataset.r;
  $$('#ranges button').forEach(x=>x.classList.toggle('on', x===b));
  render();
});
$('#gear').onclick = openSheet;
$('#sclose').onclick = ()=>$('#sheet').classList.add('hide');
$('#ssave').onclick = saveSheet;
$('#sheet').addEventListener('click', e=>{ if(e.target.id==='sheet') $('#sheet').classList.add('hide'); });
</script>
